<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        /* 背景動画を全画面に固定する設定 */
        #video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100; /* 文字より後ろに配置 */
            background-size: cover;
        }

        /* 文字を見やすくするための設定 */
        body {
            margin: 0;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .content h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5); /* 文字に影をつけて読みやすく */
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="video-bg">
        <source src="bg-video.mp4" type="video/mp4">
    </video>

    <div class="content">
        <h1>Welcome to My Portfolio</h1>
        <p>Adobe Illustrator & After Effects Work</p>
    </div>

</body>
</html>
